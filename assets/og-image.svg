<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f2a63c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#f2a63c" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="url(#accentGradient)" opacity="0.08"/>

  <!-- WhatsApp green accent bar -->
  <rect x="80" y="180" width="8" height="120" rx="4" fill="#25d366"/>

  <!-- Main Title -->
  <text x="140" y="245" font-family="Space Grotesk, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#textGradient)" letter-spacing="-1">PricePoa</text>

  <!-- Subtitle -->
  <text x="140" y="315" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#e2e8f0" letter-spacing="0.5">AI Price Comparison via WhatsApp</text>

  <!-- Tagline -->
  <text x="140" y="370" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Compare prices across Naivas, Carrefour, Quickmart & Chandarana</text>

  <!-- Kenya flag colors accent -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="40" height="8" rx="4" fill="#000"/>
    <rect x="0" y="10" width="40" height="8" rx="4" fill="#c8102e"/>
    <rect x="0" y="20" width="40" height="8" rx="4" fill="#007a3d"/>
    <rect x="0" y="30" width="40" height="8" rx="4" fill="#fff"/>
  </g>

  <text x="200" y="445" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="#64748b">Kenya</text>

  <!-- CTA -->
  <rect x="140" y="480" width="280" height="56" rx="28" fill="#25d366" opacity="0.9"/>
  <text x="280" y="518" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="middle">Start on WhatsApp</text>

  <!-- Bottom brand -->
  <text x="600" y="580" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle">pricepoa.co.ke</text>
</svg>